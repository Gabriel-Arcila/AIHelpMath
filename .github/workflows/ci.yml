# ──────────────────────────────────────────────────────────────────────────────
# IAHelpMath — CI Pipeline
# ──────────────────────────────────────────────────────────────────────────────
# Runs on every push / pull_request to main and develop.
# Jobs: lint (ruff) → type-check (mypy) → test (pytest + PostgreSQL)
# Best practices applied:
#   - Minimal permissions (contents: read)
#   - Concurrency groups to cancel stale runs
#   - uv caching for fast dependency installs
#   - PostgreSQL service container with health checks
#   - Separate jobs for granular status checks
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch/PR (saves runner minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default to least-privilege; individual jobs can escalate if needed.
permissions:
  contents: read

jobs:
  # ── 1. Lint (Ruff) ──────────────────────────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run Ruff linter
        run: uv run ruff check src/ tests/

      - name: Run Ruff formatter check
        run: uv run ruff format --check src/ tests/

  # ── 2. Type Check (Mypy) ────────────────────────────────────────────────────
  type-check:
    name: Type Check (Mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run Mypy
        run: uv run mypy src/ tests/

  # ── 3. Test (Pytest + PostgreSQL) ───────────────────────────────────────────
  test:
    name: Test (Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, type-check]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: iahelpmath
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user -d iahelpmath"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/iahelpmath
      TEST_DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/TestAIHelpMath

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev

      - name: Create test database
        run: |
          PGPASSWORD=password psql -h localhost -U user -d iahelpmath -c 'CREATE DATABASE "TestAIHelpMath";'

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Run tests with coverage
        run: uv run pytest -v --cov=src --cov-report=term-missing

  # ── 4. Docker Build ─────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    # Only build Docker on push (not on PRs from forks, for security).
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: aihelpmath:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
