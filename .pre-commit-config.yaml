# Configuración de pre-commit para IAHelpMath
# Para instalar los git hooks en el repositorio ejecuta:
#   uv run pre-commit install
#   uv run pre-commit install --hook-type pre-push
#
# Estrategia:
#   pre-commit → hooks rápidos (formato, lint, validaciones estáticas)
#   pre-push   → hooks pesados (mypy, alembic check, pytest)
#                 Requiere PostgreSQL activo para alembic y pytest.

default_install_hook_types: [pre-commit, pre-push]
fail_fast: true

repos:
  # ── 1. Hooks Estándar ─────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^migrations/
      - id: end-of-file-fixer
        exclude: ^migrations/
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^\.vscode/
      - id: check-ast
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: debug-statements

  # ── 2. Ruff (Linter & Formatter) ──────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ── 3. Local Hooks (pre-push: Mypy, Alembic, Pytest) ──────────────
  - repo: local
    hooks:
      - id: mypy
        name: mypy (type check)
        entry: uv run mypy src/ tests/
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: alembic-check
        name: alembic (check schema migration sync)
        entry: uv run alembic check
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: pytest
        name: pytest (test suite)
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
